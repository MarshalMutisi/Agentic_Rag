[project]
name = "agentic-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marshal", email = "mutisimarshal@gmaail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "docx2txt>=0.9",
    "fastapi>=0.162.0",
    "fonttools>=4.68.0",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.3",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.18",
    "openpyxl>=3.1.5",
    "pyjwt>=2.15.1",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1,<2.15",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agentic-rag = "agentic_rag:main"

# On Linux (the Docker image) use the CPU-only PyTorch: the default Linux build
# pulls in several GB of NVIDIA libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
